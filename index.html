<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#111418" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="抽選" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <title>抽選小幫手</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>抽選小幫手</h1>
      <button id="refresh" class="btn small">重新整理</button>
    </header>

    <main>
      <section id="home">
        <div id="status"></div>
        <div id="homeRange"></div>
      </section>
      <section id="draw" hidden>
        <a href="#" class="back">← 回首頁</a>
        <div id="drawBody"></div>
      </section>
      <section id="list" hidden>
        <a href="#" class="back">← 回首頁</a>
        <div id="listBody"></div>
      </section>
      <section id="settings" hidden>
        <a href="#" class="back">← 回首頁</a>
        <div id="settingsBody"></div>
      </section>
    </main>

    <footer class="source">
      資料來源：
      <a
        href="https://uxux11.github.io/funbox-line/"
        target="_blank"
        rel="noopener"
        >原作者整理的抽選清單</a
      >
    </footer>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
